name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run web:lint
      - run: npm run web:test
      - run: npm run web:build
